<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal — Medical Reviews</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0f172a;--surface:#1e293b;--surface-2:#334155;--border:#475569;
      --text:#f1f5f9;--text-dim:#94a3b8;--text-muted:#64748b;
      --accent:#3b82f6;--accent-2:#8b5cf6;--success:#10b981;
      --warning:#f59e0b;--danger:#ef4444;
      --font-body:'DM Sans',-apple-system,sans-serif;
      --font-mono:'Fira Code',monospace;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
    a{color:inherit;text-decoration:none}
    .header{background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);padding:32px 20px;text-align:center;border-bottom:1px solid var(--border)}
    .header h1{font-size:1.8rem;font-weight:700;margin-bottom:6px}
    .header p{color:var(--text-dim);font-size:0.95rem}
    .breadcrumb{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:14px;font-size:0.8rem;color:var(--text-muted)}
    .breadcrumb a{color:var(--accent);text-decoration:none}
    .breadcrumb a:hover{text-decoration:underline}
    .container{max-width:1100px;margin:0 auto;padding:32px 20px}
    .section-title{font-size:0.75rem;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:40px}
    .card{background:var(--surface);border:1px solid var(--border);border-left:4px solid #8b5cf6;border-radius:12px;padding:18px;cursor:pointer;transition:all 0.2s;display:block}
    .card:hover{border-color:#8b5cf6;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
    .card h3{font-size:1rem;font-weight:600;margin-bottom:4px;color:var(--text)}
    .card .meta{font-size:0.78rem;color:var(--text-muted);font-family:var(--font-mono);margin-bottom:8px}
    .card .badges{display:flex;gap:6px;flex-wrap:wrap}
    .badge{font-size:0.68rem;padding:2px 8px;border-radius:12px;font-weight:500}
    .badge-type{background:rgba(59,130,246,0.15);color:#60a5fa;border:1px solid rgba(59,130,246,0.3)}
    .badge-new{background:rgba(16,185,129,0.15);color:#34d399;border:1px solid rgba(16,185,129,0.3)}
    .footer{text-align:center;padding:20px;color:var(--text-muted);font-size:0.78rem;border-top:1px solid var(--border)}
    @media(max-width:600px){.grid{grid-template-columns:1fr}.header h1{font-size:1.4rem}}
  </style>
</head>
<body>
<div class="header">
  <h1>📓 Journal — Medical Reviews</h1>
  <p>Focused review articles and clinical analysis</p>
  <div class="breadcrumb"><a href="/">Home</a> › Journal</div>
</div>
<div class="container">
  <div class="section-title">📄 Articles</div>
  <div class="grid">
    <a class="card" href="skin_manifestations_diabetes">
      <h3>🩺 Skin Manifestations in Diabetes Mellitus</h3>
      <div class="meta">skin_manifestations_diabetes.html</div>
      <div class="badges"><span class="badge badge-type">Clinical Review</span><span class="badge badge-new">Featured</span></div>
    </a>
  </div>
</div>
<div class="footer">FOR OPENCLAW · Powered by OpenClaw · Built with 🐕 Shiba</div>
</body>
</html>
