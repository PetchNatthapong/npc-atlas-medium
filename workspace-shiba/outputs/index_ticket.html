<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>🎬 Movie Ticket Profile</title>
 <style>
 * { margin: 0; padding: 0; }
 body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0f172a; color: #f1f5f9;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
 }
 .card { background: #1a1f2e; border-radius: 20px; max-width: 420px; width: 100%; border: 4px solid #3b82f6; overflow: hidden; }
 .poster { width: 100%; height: auto; display: block; }
 .body { padding: 16px; }
 .scores { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
 .badge { display: inline-flex; align-items: center; justify-content: center; padding: 10px 14px; border-radius: 8px; font-weight: 700; font-size: 14px; min-width: 55px; }
 .imdb { background: #fbbf24; color: #000; }
 .rt { background: #fa320a; color: #fff; }
 .my { background: #f97316; color: #fff; }
 .shiba { background: #8b5cf6; color: #fff; }
 .title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
 .subtitle { font-size: 16px; color: #fbbf24; margin-bottom: 4px; }
 .director { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
 .genres { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
 .tag { background: rgba(59,130,246,0.15); color: #60a5fa; padding: 4px 10px; border-radius: 6px; font-size: 12px; }
 .cinema { background: #252d3d; border-radius: 10px; padding: 12px; margin-bottom: 14px; text-align: center; border-left: 4px solid #3b82f6; }
 .cinema-name { font-size: 16px; font-weight: 600; }
 .cinema-detail { font-size: 12px; color: #94a3b8; margin-top: 2px; }
 .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
 .info-item { background: #252d3d; border-radius: 8px; padding: 12px 8px; text-align: center; }
 .info-label { font-size: 11px; color: #94a3b8; margin-bottom: 2px; }
 .info-value { font-size: 16px; font-weight: 600; }
 .score-box { background: #252d3d; border-radius: 10px; padding: 24px 16px; margin-bottom: 14px; text-align: center; }
 .score-num { font-size: 48px; font-weight: 700; color: #f97316; margin-bottom: 20px; }
 .btn-row { display: flex; gap: 24px; justify-content: center; align-items: center; }
 .btn {
  width: 64px; height: 64px; border-radius: 50%;
  border: none; background: #3b82f6; color: white;
  font-size: 32px; font-weight: 300;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  position: relative; transition: transform 0.1s, background 0.1s;
 }
 .btn:active { transform: scale(0.92); background: #2563eb; }
 .btn::before { content: ''; position: absolute; width: 24px; height: 3px; background: white; border-radius: 2px; }
 .btn.plus::after { content: ''; position: absolute; width: 3px; height: 24px; background: white; border-radius: 2px; }
 .footer { background: #252d3d; padding: 12px; text-align: center; font-size: 11px; color: #94a3b8; }
 </style>
</head>
